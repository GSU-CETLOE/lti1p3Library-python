[project]
name = "lti1p3"
version = "0.1.0"
description = "LTI 1.3 Advantage tool-side library (OIDC launch, Deep Linking, AGS, NRPS), framework-agnostic"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jeb Barger", email = "jebba2@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=44.0",
    "httpx>=0.28",
    "pyjwt>=2.10",
]

[project.scripts]
lti1p3-generate-keypair = "lti1p3.console:main"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lti1p3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "examples"]
typeCheckingMode = "strict"
